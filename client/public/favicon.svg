<!--
  Rivers Real Estate favicon — the brand mark from client/src/components/logo.tsx
  (tall trapezoidal house with the skewed roofline and a 2x2 window grid),
  redrawn for small sizes.

  Two deliberate departures from the logo, both for legibility below 48px:
  the inner room outline is dropped (at 16px it merges with the outer wall
  into a stack of rectangles), and the windows are enlarged and squared up so
  they survive downscaling. The silhouette and the gold gradient — the parts
  that read as the brand — are unchanged.

  Google crops favicons to a circle in search results, so the mark is centred
  in the tile with nothing meaningful near the corners.

  If the logo mark changes, update this file and regenerate the raster set
  (favicon.ico, favicon-96x96, favicon-192x192, favicon-512x512,
  apple-touch-icon) from it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="riversGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8893D"/>
      <stop offset="38%" stop-color="#D4AF37"/>
      <stop offset="58%" stop-color="#F0D785"/>
      <stop offset="100%" stop-color="#9C7424"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="#000"/>

  <!-- Logo mark, centred on the tile (the mark's own centre is x=34, y=32). -->
  <g transform="translate(32 32) scale(1.06) translate(-34 -32)">
    <path d="M16 8 L52 12 L52 56 L16 56 Z"
          fill="none" stroke="url(#riversGold)" stroke-width="4" stroke-linejoin="miter"/>
    <rect x="26" y="28" width="6" height="6" fill="url(#riversGold)"/>
    <rect x="36" y="29" width="6" height="6" fill="url(#riversGold)"/>
    <rect x="26" y="38" width="6" height="6" fill="url(#riversGold)"/>
    <rect x="36" y="38" width="6" height="6" fill="url(#riversGold)"/>
  </g>
</svg>
